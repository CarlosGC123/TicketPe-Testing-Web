webdriver {
    autodownload=true
    driver=chrome
    timeouts {
        pageLoad = 60000
        implicitlyWait = 0
        script = 30000
    }
    capabilities {
        acceptInsecureCerts = true
        pageLoadStrategy = "eager"
        "goog:chromeOptions" {
            args = [
                "--headless=new",
                "--no-sandbox",
                "--disable-infobars",
                "--disable-notifications",
                "--start-maximized",
                "--disable-dev-shm-usage",
                "--disable-gpu",
                "--window-size=1280,720",
                "--remote-allow-origins=*",
                "--disable-blink-features=AutomationControlled",
            ]
            excludeSwitches = ["enable-automation"]
            useAutomationExtension = false
        }
    }
}

environments {
    DESARROLLO {
        baseurl="Enlace de entorno de Desarrollo"
    }
    INTEGRACION {
        baseurl="Enlace de entorno de Integración"
    }
    PREPRODUCCION {
        baseurl="Enlace de entorno Pre producción"
    }
    PRODUCCION {
        baseurl="https://testathon.testingperu.com/"
    }
}